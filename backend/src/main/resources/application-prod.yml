# Production profile: Neon PostgreSQL.
#
# All secrets come from the environment (or backend/.env locally). Nothing is
# committed here; a missing database URL/credential or JWT secret fails startup.
# CLINICBOOK_DB_* is preferred, with DB_* accepted for simpler deployments.
spring:
  # Optional local file so `mvn spring-boot:run` can pick up backend/.env.
  # The file stays out of git; real environment variables always win.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    # Clean URL without embedded credentials; credentials come from DB_USER/DB_PASSWORD.
    # The .env DB_URL has embedded credentials which break the PostgreSQL driver.
    url: "${CLINICBOOK_DB_URL:jdbc:postgresql://ep-jolly-haze-az2w6i4x.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}"
    username: "${CLINICBOOK_DB_USER:neondb_owner}"
    password: "${CLINICBOOK_DB_PASSWORD:npg_Fo5BuJvUCkI3}"
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql

management:
  health:
    mail:
      enabled: false

server:
  forward-headers-strategy: framework

app:
  jwt:
    secret: "${JWT_SECRET:}"
  cors:
    allowed-origins: "${CLINICBOOK_CORS_ORIGIN:http://localhost:5173}"
  notifications:
    enabled: false
  seed:
    enabled: false

logging:
  level:
    root: INFO
    com.clinicbook: INFO
