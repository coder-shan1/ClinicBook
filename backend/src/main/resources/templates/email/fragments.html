<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ClinicBook</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">

<div th:fragment="header" style="background:#0f766e;padding:20px 28px;">
    <span style="color:#ffffff;font-size:20px;font-weight:bold;letter-spacing:0.3px;"
          th:text="${view.clinicName}">ClinicBook</span>
</div>

<table th:fragment="details"
       style="width:100%;border-collapse:collapse;margin:24px 0;background:#ffffff;border:1px solid #e4e7eb;border-radius:6px;">
    <tr>
        <td style="padding:12px 16px;color:#52606d;font-size:14px;width:42%;">Appointment</td>
        <td style="padding:12px 16px;font-size:14px;font-weight:bold;"
            th:text="|#${view.appointmentId}|">#42</td>
    </tr>
    <tr style="background:#f8fafb;">
        <td style="padding:12px 16px;color:#52606d;font-size:14px;">Doctor</td>
        <td style="padding:12px 16px;font-size:14px;"
            th:text="${view.doctorName}">Dr. Jane Doe</td>
    </tr>
    <tr>
        <td style="padding:12px 16px;color:#52606d;font-size:14px;">Specialty</td>
        <td style="padding:12px 16px;font-size:14px;"
            th:text="${view.specialty}">Cardiology</td>
    </tr>
    <tr style="background:#f8fafb;">
        <td style="padding:12px 16px;color:#52606d;font-size:14px;">When</td>
        <td style="padding:12px 16px;font-size:14px;"
            th:text="${view.startsAt}">Monday, 5 January 2026 at 09:00 IST</td>
    </tr>
</table>

<div th:fragment="footer" style="margin-top:28px;padding-top:16px;border-top:1px solid #e4e7eb;
        color:#7b8794;font-size:12px;line-height:1.6;">
    <p style="margin:0 0 6px 0;">
        This is an automated message from
        <span th:text="${view.clinicName}">ClinicBook</span>.
    </p>
    <p style="margin:0;">Please do not reply to this email.</p>
</div>

</body>
</html>
