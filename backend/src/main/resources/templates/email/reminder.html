<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{email/fragments :: head}"></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<div style="max-width:560px;margin:0 auto;padding:24px;">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="background:#ffffff;padding:28px;border-radius:6px;">
        <h1 style="margin:0 0 16px 0;font-size:22px;color:#0f766e;">Appointment reminder</h1>
        <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;">
            Hi <span th:text="${view.patientName}">Patient</span>,
        </p>
        <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;">
            This is a friendly reminder that your appointment with
            <strong th:text="${view.doctorName}">Dr. Jane Doe</strong> is coming up.
        </p>
        <div th:replace="~{email/fragments :: details}"></div>
        <p style="margin:0;font-size:15px;line-height:1.6;">
            If you can no longer attend, please cancel from your account so the time can be
            offered to another patient.
        </p>
        <div th:replace="~{email/fragments :: footer}"></div>
    </div>
</div>
</body>
</html>
