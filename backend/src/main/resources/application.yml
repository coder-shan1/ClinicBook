spring:
  application:
    name: clinicbook
  profiles:
    default: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  mail:
    # Local development uses Mailpit / MailHog on port 1025. Override for real SMTP.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    parser:
      # Reject bodies such as {"email":"a@b.co","email":"c@d.co"} instead of silently
      # letting the last value win during validation.
      strict-duplicate-detection: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    issuer: ${JWT_ISSUER:clinicbook}
    # Must be at least 32 bytes. Set JWT_SECRET outside the local profile.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  rate-limit:
    login:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
  clinic:
    # Working hours are wall-clock times in this zone; slots are stored as UTC.
    zone: ${CLINIC_TIME_ZONE:Asia/Kolkata}
    slot-horizon-days: ${SLOT_HORIZON_DAYS:30}
  slot:
    nightly-cron: ${SLOT_NIGHTLY_CRON:0 0 3 * * *}
  booking:
    # Patients cannot cancel later than this before the slot starts. Staff are exempt.
    cancel-cutoff: ${BOOKING_CANCEL_CUTOFF:2h}
    # PENDING + CONFIRMED appointments a patient may hold at once.
    max-active-per-patient: ${BOOKING_MAX_ACTIVE_PER_PATIENT:3}
  notifications:
    # Emails are best-effort; failures are logged but never break an appointment action.
    enabled: ${NOTIFICATIONS_ENABLED:true}
    from: ${MAIL_FROM:no-reply@clinicbook.local}
    clinic-name: ${CLINIC_NAME:ClinicBook}
    # Runs hourly by default. The job only emails CONFIRMED appointments starting
    # within the reminder lead time, and notification_log makes each send idempotent.
    reminder-cron: ${REMINDER_CRON:0 0 * * * *}
    reminder-lead: ${REMINDER_LEAD:24h}
  seed:
    # Local-profile demo data. Disable with SEED_ENABLED=false.
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-none}] - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
