spring:
  datasource:
    url: ${CLINICBOOK_DB_URL:jdbc:mysql://localhost:3306/clinicbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CLINICBOOK_DB_USER:clinicbook}
    password: ${CLINICBOOK_DB_PASSWORD:clinicbook}

app:
  jwt:
    # Development-only key so the local profile starts without configuration.
    secret: ${JWT_SECRET:dev-only-clinicbook-secret-change-me-0123456789abcdef0123456789abcdef}

logging:
  level:
    com.clinicbook: DEBUG
