spring:
  datasource:
    url: ${CLINICBOOK_DB_URL:jdbc:mysql://localhost:3306/clinicbook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CLINICBOOK_DB_USER:clinicbook}
    # No default: copy .env.sample to .env (or export the variable) before running.
    password: ${CLINICBOOK_DB_PASSWORD}

app:
  jwt:
    # No default: copy .env.sample to .env and set JWT_SECRET (>= 32 bytes).
    secret: ${JWT_SECRET}

logging:
  level:
    com.clinicbook: DEBUG
